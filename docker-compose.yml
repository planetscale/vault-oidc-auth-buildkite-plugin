version: '2'
services:
  lint-shellcheck:
    image: koalaman/shellcheck-alpine:v0.11.0@sha256:9955be09ea7f0dbf7ae942ac1f2094355bb30d96fffba0ec09f5432207544002
    volumes:
      - ".:/plugin:ro"
    entrypoint: sh
    command:
      - -c
      - 'shellcheck /plugin/hooks/*'

  lint-plugin:
    image: buildkite/plugin-linter:v3.1.0@sha256:5c02fdc2067f7dd78eba94fed93a396cf36149887e6350f222a7331a65a322ad
    volumes:
      - ".:/plugin:ro"
    command:
      - --id=planetscale/vault-oidc-auth

  tests:
    image: buildkite/plugin-tester:v4.2.0@sha256:21067012f59af6b8316cceb95850e89a542b50338c72d209a68bbebb33aff8c3
    volumes:
      - ".:/plugin:ro"
