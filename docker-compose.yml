version: '2'
services:
  lint-shellcheck:
    image: koalaman/shellcheck-alpine:v0.11.0@sha256:9955be09ea7f0dbf7ae942ac1f2094355bb30d96fffba0ec09f5432207544002
    volumes:
      - ".:/plugin:ro"
    entrypoint: sh
    command:
      - -c
      - 'shellcheck /plugin/hooks/*'

  lint-plugin:
    image: buildkite/plugin-linter:v2.1.0@sha256:bcd1e565e14bbef2f76266ac935e17c419caaf39e0809f84adf522976c27072a
    volumes:
      - ".:/plugin:ro"
    command:
      - --id=planetscale/vault-oidc-auth

  tests:
    image: buildkite/plugin-tester:v4.4.0@sha256:227f1ca092928541e52dc82a4af51943bc3e69451fe7eb4473e484f66e3a4447
    volumes:
      - ".:/plugin:ro"
